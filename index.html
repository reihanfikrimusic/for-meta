    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(255, 255, 255, 0.35);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-muted: #555555;
            --accent: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            letter-spacing: -0.01em;
        }

        /* Subtle monochromatic background noise/glow effect */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile & Artwork Section */
        .cover-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .cover-art {
            width: 190px;
            height: 190px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            transition: transform 0.4s ease;
        }

        .cover-art:hover {
            transform: scale(1.02);
        }

        /* Text Headers */
        .track-info {
            text-align: center;
            margin-bottom: 32px;
        }

        .artist-name {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .track-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .instruction {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Platform Links Section */
        .links-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 36px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .link-card:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .platform-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .platform-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .platform-name {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .play-tag {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .link-card:hover .play-tag {
            background: var(--text-primary);
            color: var(--bg-color);
            border-color: var(--text-primary);
        }

        /* Social Media Icons */
        .socials {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .social-link {
            color: var(--text-secondary);
            transition: color 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-link:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .social-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-align: center;
        }
    </style>
</head>
